<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="6×6 ve 9×9 Sudoku. Kendi hızında çöz, çevrimdışı devam et.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Sudoku Rivals</title>
</head>
<body>
  <a class="skip-link" href="#content">İçeriğe geç</a>
  <div class="app-shell">
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Sudoku Rivals ana sayfa" id="brand-home">
        <svg viewBox="0 0 192 192" width="34" height="34" aria-hidden="true"><rect width="192" height="192" fill="#1d4ed8"/><rect x="36" y="36" width="120" height="120" rx="10" fill="none" stroke="#fff" stroke-width="7"/><path d="M76 36v120m40-120v120M36 76h120M36 116h120" stroke="#fff" stroke-width="6"/><rect x="82" y="82" width="28" height="28" fill="#fff"/></svg>
        <span data-testid="app-title" translate="no">Sudoku <strong>Rivals</strong></span>
      </a>
      <button id="settings-button" class="icon-button" data-testid="settings-open" aria-label="Ayarlar" title="Ayarlar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--background)"/><circle cx="15" cy="17" r="3" fill="var(--background)"/></svg>
      </button>
    </header>
    <main id="content" tabindex="-1"><p class="loading" role="status">Oyun hazırlanıyor…</p></main>
    <footer class="site-footer"><span id="offline-status" role="status">Çevrimdışı kullanım hazırlanıyor</span><span>6×6 &amp; 9×9</span></footer>
  </div>
  <dialog id="confirm" class="sheet" aria-labelledby="confirm-text">
    <form method="dialog"><p id="confirm-text"></p><div class="sheet-actions"><button class="secondary-button" value="cancel">Vazgeç</button><button class="primary-button" value="ok">Devam et</button></div></form>
  </dialog>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
