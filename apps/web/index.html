<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="6×6 ve 9×9 Sudoku. Kendi hızında çöz, çevrimdışı devam et.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea" data-color="#f4f1ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214" data-color="#121214">
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="/pkg/sudoku_wasm_bg.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    // A chosen Light/Dark theme is applied before the stylesheet paints, so the page never flashes the system theme.
    try {
      var saved = JSON.parse(localStorage.getItem('sudoku-rivals.preferences.v1'));
      if (saved && (saved.theme === 'light' || saved.theme === 'dark')) {
        document.documentElement.dataset.theme = saved.theme;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.content = saved.theme === 'dark' ? '#121214' : '#f4f1ea'; });
      }
    } catch (error) { /* Blocked or malformed storage: the system theme stays. */ }
  </script>
  <link rel="stylesheet" href="/styles.css">
  <title>Sudoku Rivals</title>
</head>
<body>
  <a class="skip-link" href="#content">İçeriğe geç</a>
  <div class="app-shell">
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Sudoku Rivals ana sayfa" id="brand-home">
        <svg viewBox="0 0 192 192" width="34" height="34" aria-hidden="true"><rect width="192" height="192" fill="#1d4ed8"/><rect x="39" y="39" width="114" height="114" rx="25" fill="#f5b453" transform="rotate(12 96 96) translate(11 -13)"/><rect x="39" y="39" width="114" height="114" rx="25" fill="#fff"/><path d="M72.33 39h7v114h-7zM112.67 39h7v114h-7zM39 72.33h114v7h-114zM39 112.67h114v7h-114z" fill="#1d4ed8"/><path d="M79.33 79.33h33.33v33.33h-33.33z" fill="#f5b453"/></svg>
        <span data-testid="app-title" translate="no">Sudoku <strong>Rivals</strong></span>
      </a>
      <button id="settings-button" disabled class="icon-button" data-testid="settings-open" aria-label="Ayarlar" title="Ayarlar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--background)"/><circle cx="15" cy="17" r="3" fill="var(--background)"/></svg>
      </button>
    </header>
    <main id="content" tabindex="-1"><p class="loading" role="status">Oyun hazırlanıyor…</p></main>
    <footer class="site-footer"><span class="offline-indicator" data-state="offlinePreparing">
      <svg class="when-ready" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>
      <svg class="when-preparing" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10m0 0-4-4m4 4 4-4M5 19h14"/></svg>
      <svg class="when-unavailable" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M7.4 7.6A5 5 0 0 0 7 17.5h10M10.3 5.3A6 6 0 0 1 17.8 10a4 4 0 0 1 2.9 6"/></svg>
      <span id="offline-status" role="status">Çevrimdışı kullanım hazırlanıyor</span></span></footer>
  </div>
  <dialog id="confirm" class="sheet" aria-labelledby="confirm-text">
    <form method="dialog"><p id="confirm-text"></p><div class="sheet-actions"><button class="secondary-button" value="cancel">Vazgeç</button><button class="primary-button" value="ok">Devam et</button></div></form>
  </dialog>
  <div id="transient-notice" class="transient-notice" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
