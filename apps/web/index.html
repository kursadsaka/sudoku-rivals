<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="6×6 ve 9×9 Sudoku. Kendi hızında çöz, çevrimdışı devam et.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Sudoku Rivals</title>
</head>
<body>
  <a class="skip-link" href="#content">İçeriğe geç</a>
  <div class="app-shell">
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="Sudoku Rivals ana sayfa" id="brand-home">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 1v22M16 1v22M1 9h22M1 16h22" stroke="currentColor" stroke-width="1.2"/><rect x="10" y="10" width="5" height="5" fill="currentColor"/></svg>
        <span data-testid="app-title">Sudoku <strong>Rivals</strong></span>
      </a>
      <button id="settings-button" class="icon-button" data-testid="settings-open" aria-label="Ayarlar" title="Ayarlar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--background)"/><circle cx="15" cy="17" r="3" fill="var(--background)"/></svg>
      </button>
    </header>
    <main id="content" tabindex="-1"><p class="loading" role="status">Oyun hazırlanıyor…</p></main>
    <footer class="site-footer"><span id="offline-status" role="status">Çevrimdışı kullanım hazırlanıyor</span><span>6×6 & 9×9</span></footer>
  </div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
