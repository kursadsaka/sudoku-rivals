name: SudokuRivals
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  SudokuRivals:
    type: application
    platform: iOS
    sources:
      - SudokuRivals
      - generated/sudoku_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sudokurivals
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/generated"
        # Rust only builds aarch64-apple-ios-sim; Intel simulators are not supported.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - framework: generated/SudokuFFI.xcframework
  SudokuRivalsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SudokuRivalsTests
      - path: ../../vectors/boards.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SudokuRivals
schemes:
  SudokuRivals:
    build:
      targets:
        SudokuRivals: all
    test:
      targets:
        - SudokuRivalsTests
