name: SudokuRivals
options:
  deploymentTarget:
    iOS: "17.0"
# Staging is a Release-derived configuration for the fixed HTTPS Render staging origin (G16).
configs:
  Debug: debug
  Release: release
  Staging: release
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SudokuRivals:
    type: application
    platform: iOS
    sources:
      - SudokuRivals
      - generated/sudoku_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sudokurivals
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Sudoku Rivals
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/generated"
        # Rust only builds aarch64-apple-ios-sim; Intel simulators are not supported.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      configs:
        # Placeholder identifier like the base one: the real bundle ID, team and signing are owner decisions.
        # Own bundle ID => own data container, so debug/release records are never touched. No ATS exception.
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.sudokurivals.staging
          INFOPLIST_KEY_CFBundleDisplayName: Sudoku Rivals Staging
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
    dependencies:
      - framework: generated/SudokuFFI.xcframework
  # Logic tests run inside the app host so they call the real Rust core.
  SudokuRivalsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SudokuRivalsTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sudokurivals.tests
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - target: SudokuRivals
  SudokuRivalsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SudokuRivalsUITests
      # The live-match opponent runs in the test process on the same adapter and Rust client.
      - SudokuRivals/LiveSession.swift
      - SudokuRivals/Strings.swift
      - generated/sudoku_ffi.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sudokurivals.uitests
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/generated"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - target: SudokuRivals
      - framework: generated/SudokuFFI.xcframework
schemes:
  SudokuRivals:
    build:
      targets:
        SudokuRivals: all
    test:
      config: Debug
      targets:
        - SudokuRivalsTests
        - SudokuRivalsUITests
  # Build/run/archive the fixed-origin HTTPS staging app (no tests: they need Debug testability).
  SudokuRivalsStaging:
    build:
      targets:
        SudokuRivals: all
    run:
      config: Staging
    profile:
      config: Staging
    archive:
      config: Staging
